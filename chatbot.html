<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chatbot</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-box {
      width: 400px;
      background: #111827;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    #messages {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #333;
      padding: 10px;
      margin-bottom: 10px;
      background: #0b1220;
    }

    .msg {
      margin: 5px 0;
    }

    .user {
      color: #38bdf8;
    }

    .bot {
      color: #22c55e;
    }

    input {
      width: 75%;
      padding: 10px;
      border: none;
      border-radius: 5px;
    }

    button {
      width: 20%;
      padding: 10px;
      border: none;
      background: #3b82f6;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }
  </style>
</head>

<body>

<div class="chat-box">
  <h2>AI Chatbot</h2>

  <div id="messages"></div>

  <input id="input" type="text" placeholder="Type message..." />
  <button onclick="sendMessage()">Send</button>
</div>

<script>
async function sendMessage() {
  const input = document.getElementById("input");
  const msg = input.value;
  if (!msg) return;

  addMessage("You", msg, "user");
  input.value = "";

  const res = await fetch("http://127.0.0.1:8000/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ message: msg })
  });

  const data = await res.json();

  addMessage("Bot", data.response + " (confidence: " + data.confidence + ")", "bot");
}

function addMessage(sender, text, className) {
  const div = document.createElement("div");
  div.className = "msg " + className;
  div.innerHTML = `<b>${sender}:</b> ${text}`;
  document.getElementById("messages").appendChild(div);
}
</script>

</body>
</html>
